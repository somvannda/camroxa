name: PR checks

on:
  pull_request:
    branches: [main, master]

jobs:
  changed-python-syntax:
    name: Changed Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile changed .py files
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD -- '*.py' || true)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No Python files changed."
            exit 0
          fi
          echo "Checking ${#FILES[@]} file(s):"
          printf '  %s\n' "${FILES[@]}"
          python -m py_compile "${FILES[@]}"
          echo "OK"

  no-secrets-in-diff:
    name: Block secret-looking paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse secrets / credential dumps in PR
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          mapfile -t FILES < <(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD || true)
          FAIL=0
          for f in "${FILES[@]}"; do
            case "$f" in
              .deploy/secrets.env|.deploy/secrets.sandbox.env|.deploy/secrets.production.env|*.pem|*/credentials.json)
                echo "REFUSE: $f must not be committed"
                FAIL=1
                ;;
            esac
            # allow *.env.example only
            if [[ "$f" == *.env && "$f" != *.env.example ]]; then
              if [[ "$f" == .deploy/secrets*.env ]]; then
                echo "REFUSE: $f"
                FAIL=1
              fi
            fi
          done
          exit "$FAIL"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  admin-portal-build:
    name: Admin portal build (if changed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect admin_portal changes
        id: changes
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE"...HEAD -- admin_portal/ | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin_portal/package-lock.json

      - name: npm ci && build
        if: steps.changes.outputs.run == 'true'
        working-directory: admin_portal
        run: |
          npm ci
          CI=1 npm run build

  musicapi-checks:
    name: MusicAPI typecheck + build (if changed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect musicapi changes
        id: changes
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE"...HEAD -- musicapi/ | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            musicapi/package-lock.json
            musicapi/web-user/package-lock.json
            musicapi/web-admin/package-lock.json

      - name: Core — npm ci, typecheck, build
        if: steps.changes.outputs.run == 'true'
        working-directory: musicapi
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          npm run test:unit

      - name: web-user — npm ci, typecheck, build
        if: steps.changes.outputs.run == 'true'
        working-directory: musicapi/web-user
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          CI=1 npm run build

      - name: web-admin — npm ci, typecheck, build
        if: steps.changes.outputs.run == 'true'
        working-directory: musicapi/web-admin
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          CI=1 npm run build

  musicapi-smoke:
    name: MusicAPI smoke gate (if changed)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sunoapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sunoapi
      # config.ts refuses to start without a strong JWT_SECRET and a 64-hex
      # COOKIE_ENCRYPTION_KEY, so the smoke boot needs throwaway values.
      JWT_SECRET: ci-smoke-jwt-secret-0123456789abcdef0123456789abcdef
      COOKIE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PORT: "4003"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect musicapi changes
        id: changes
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE"...HEAD -- musicapi/ | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: musicapi/package-lock.json

      - name: Install core deps
        if: steps.changes.outputs.run == 'true'
        working-directory: musicapi
        run: npm ci --no-audit --no-fund

      - name: Apply migrations
        if: steps.changes.outputs.run == 'true'
        working-directory: musicapi
        run: ./node_modules/.bin/tsx scripts/migrate.ts

      - name: Boot server and probe routes
        if: steps.changes.outputs.run == 'true'
        working-directory: musicapi
        shell: bash
        run: |
          set -euo pipefail
          BASE="http://127.0.0.1:4003"
          npm run serve > /tmp/musicapi.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS "$BASE/health" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if ! curl -fsS "$BASE/health" >/dev/null 2>&1; then
            echo "server did not become healthy in 30s"
            tail -n 50 /tmp/musicapi.log
            exit 1
          fi

          echo "--- /health"
          HEALTH="$(curl -fsS "$BASE/health")"
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"ok":true' || { echo "health body missing ok:true"; exit 1; }

          echo "--- /metrics expects 401 (admin-only)"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "$BASE/metrics")"
          test "$CODE" = "401" || { echo "expected 401, got $CODE"; tail -n 50 /tmp/musicapi.log; exit 1; }

          echo "--- /auth/register expects 405 (self-registration disabled)"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' "$BASE/auth/register")"
          test "$CODE" = "405" || { echo "expected 405, got $CODE"; tail -n 50 /tmp/musicapi.log; exit 1; }

          echo "Smoke OK"

  web-admin-tests:
    name: web-admin unit tests (if changed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect web-admin changes
        id: changes
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE"...HEAD -- musicapi/web-admin/ | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # The formatter tests rely on Node's native TypeScript support (Node >= 24).
      # They need no dependencies, so no install step is required.
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "24"

      - name: npm test
        if: steps.changes.outputs.run == 'true'
        working-directory: musicapi/web-admin
        run: npm test

  # The five web/API surfaces above did not all get built: music_web and website
  # had no job at all, and platform_api was only syntax-checked (py_compile), so a
  # PR could go green while its tests failed. Those are covered below.
  platform-api-tests:
    name: Platform API tests (if changed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect platform_api changes
        id: changes
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          # Also run when this workflow changes, so a CI edit is exercised (and a
          # broken gate cannot land unnoticed) on its own PR.
          if git diff --name-only "$BASE"...HEAD -- platform_api/ .github/workflows/pr-checks.yml | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install platform_api with dev extras
        if: steps.changes.outputs.run == 'true'
        working-directory: platform_api
        run: pip install -e ".[dev]"

      # The suite runs without a database; billing/credit logic is unit-tested
      # against fakes, so no service container is needed.
      #
      # Non-blocking for now. ~13 tests are Windows-only: they assert absolute
      # Windows paths and backslash separators (test_run_directory_planner,
      # test_batch_service, test_media_router, test_image_job_service,
      # test_music_history_router, plus one route-mount assertion), so the suite
      # cannot be green on the Linux runner even on an untouched tree. This job
      # still runs it for signal -- the billing/credit tests do pass (3197).
      # Drop `continue-on-error` once those tests are cross-platform.
      - name: pytest
        if: steps.changes.outputs.run == 'true'
        continue-on-error: true
        working-directory: platform_api
        run: python -m pytest -q

      # Blocking gate for the suites that are cross-platform and carry the most
      # risk: web-music generation/charging, credits and billing. They are
      # mock-based (no DB/Redis) and run on Linux, so a regression here fails the
      # PR instead of only showing up in the non-blocking run above.
      - name: "pytest (blocking: web-music, credits, billing)"
        if: steps.changes.outputs.run == 'true'
        working-directory: platform_api
        run: python -m pytest tests/test_web_music_*.py tests/test_credit_*.py tests/test_billing_*.py -q

  music-web-checks:
    name: Music portal tests + build (if changed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect music_web changes
        id: changes
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE"...HEAD -- music_web/ | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Node 24: the lib tests run via `node --experimental-strip-types`.
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: music_web/package-lock.json

      - name: npm ci
        if: steps.changes.outputs.run == 'true'
        working-directory: music_web
        run: npm ci --no-audit --no-fund

      - name: unit tests
        if: steps.changes.outputs.run == 'true'
        working-directory: music_web
        run: npm test

      # `next build` typechecks as well, so no separate bare `tsc --noEmit` step:
      # the lib tests import './x.ts' and that alone trips TS5097.
      - name: build
        if: steps.changes.outputs.run == 'true'
        working-directory: music_web
        run: CI=1 npm run build

  website-build:
    name: Website typecheck + build (if changed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect website changes
        id: changes
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE"...HEAD -- website/ | grep -q .; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: npm ci
        if: steps.changes.outputs.run == 'true'
        working-directory: website
        run: npm ci --no-audit --no-fund

      - name: typecheck
        if: steps.changes.outputs.run == 'true'
        working-directory: website
        run: npx tsc --noEmit

      # The build pulls Inter/Outfit from Google Fonts (`next/font/google` in
      # app/layout.tsx). The runner cannot always reach fonts.googleapis.com, and
      # that fails the build with a module-not-found on the internal font CSS even
      # on an untouched tree -- so this is non-blocking rather than a gate. The fix
      # is to vendor the fonts (next/font/local); drop continue-on-error then.
      # `tsc --noEmit` above stays blocking: it is deterministic.
      - name: build
        if: steps.changes.outputs.run == 'true'
        continue-on-error: true
        working-directory: website
        run: CI=1 npm run build
