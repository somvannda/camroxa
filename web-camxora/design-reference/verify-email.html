<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify email — Camxora</title>
<link rel="icon" href="camxora-logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="fontawesome/css/all.min.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body data-auth="out" class="auth-body">
<div class="auth-page">
  <div class="auth-visual">
    <img src="hero.png" alt="Singer with headphones in neon light" />
    <div class="quote">
      <div class="eyebrow">Camxora</div>
      <h2>Create. Discover.<br />Enjoy AI Music.</h2>
      <p>Listen to what creators are making, then make the next track everyone plays.</p>
    </div>
  </div>
  <div class="auth-panel">
    <div class="auth-card">
      <a class="auth-brand" href="index.html"><img src="camxora-logo.svg" alt="" /> CAMXORA</a>
      
<h1>Check your email.</h1>
<p class="sub">Enter the 6-digit code we sent to you.</p>
<form class="auth-form" data-auth-form>
  <div class="otp">
    <input inputmode="numeric" maxlength="1" aria-label="Digit 1" />
    <input inputmode="numeric" maxlength="1" aria-label="Digit 2" />
    <input inputmode="numeric" maxlength="1" aria-label="Digit 3" />
    <input inputmode="numeric" maxlength="1" aria-label="Digit 4" />
    <input inputmode="numeric" maxlength="1" aria-label="Digit 5" />
    <input inputmode="numeric" maxlength="1" aria-label="Digit 6" />
  </div>
  <button class="auth-btn primary" type="submit"><i class="fa-classic fa-solid fa-check"></i> Verify email</button>
</form>
<p class="auth-alt">Didn’t get it? <a href="#">Resend code</a> · <a href="signup.html">Change email</a></p>

    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
