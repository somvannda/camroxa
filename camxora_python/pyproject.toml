[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "camxora"
version = "1.2.4"
description = "AI-powered desktop content creation platform"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "PySide6>=6.7.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "cryptography>=42.0",
    "websockets>=12.0",
    # Video live preview + export (shipped with the desktop app; end users never pip-install these)
    "moderngl>=5.8",
    "numpy>=1.26",
    "Pillow>=10.0",
    "pygame>=2.5",
    "glfw>=2.6",
    "PyOpenGL>=3.1",
    "librosa>=0.10",
    "soundfile>=0.12",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.3",
    "ruff>=0.2",
    "mypy>=1.8",
]
# Kept as an alias so older docs/scripts using ".[gpu]" still work.
gpu = [
    "moderngl>=5.8",
    "numpy>=1.26",
    "Pillow>=10.0",
    "pygame>=2.5",
    "glfw>=2.6",
    "PyOpenGL>=3.1",
    "librosa>=0.10",
    "soundfile>=0.12",
    "opencv-python-headless>=4.8",
]

[project.scripts]
camxora = "app.bootstrap:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "shared*", "features*", "database*", "visualizer*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "gpu: requires GLFW/OpenGL GPU context (skipped on headless CI)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
