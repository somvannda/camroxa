[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-camxora"
version = "0.1.0"
description = "Camxora Studio — a CapCut-style multi-track video editor built with PySide6"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "PySide6>=6.7.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "soundfile>=0.12",
    "librosa>=0.10",
    "sounddevice>=0.4.6",
    "Pillow>=10.0",
    "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.3",
    "ruff>=0.2",
]
ai = [
    "rembg>=2.0",
]

[project.scripts]
camxora-studio = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "media*", "render*", "audio*", "export*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
