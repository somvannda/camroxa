appId: com.camxora.desktop
productName: Camxora
icon: resources/icon.png
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: vizzy-dist
    to: vizzy-dist
win:
  icon: resources/icon.ico
  target:
    - nsis
  artifactName: Camxora-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
