appId: com.camxora.desktop
productName: Camxora
icon: resources/icon.png
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: vizzy-dist
    to: vizzy-dist
  - from: vizzy-library
    to: vizzy-library
win:
  icon: resources/icon.ico
  target:
    - nsis
  artifactName: Camxora-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Remove the legacy 1.7.1 (Inno Setup) app before installing 2.0.0.
  include: resources/installer.nsh
