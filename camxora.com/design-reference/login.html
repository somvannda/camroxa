<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Camxora</title>
<link rel="icon" href="camxora-logo.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="fontawesome/css/all.min.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body data-auth="out" class="auth-body">
<div class="auth-page">
  <div class="auth-visual">
    <img src="hero.png" alt="Singer with headphones in neon light" />
    <div class="quote">
      <div class="eyebrow">Camxora</div>
      <h2>Create. Discover.<br />Enjoy AI Music.</h2>
      <p>Listen to what creators are making, then make the next track everyone plays.</p>
    </div>
  </div>
  <div class="auth-panel">
    <div class="auth-card">
      <a class="auth-brand" href="index.html"><img src="camxora-logo.svg" alt="" /> CAMXORA</a>
      
<h1>Welcome back.</h1>
<p class="sub">Sign in to listen, create and publish.</p>
<form class="auth-form" data-auth-form>
  <div class="auth-field"><label>Email</label><input class="auth-input" type="email" placeholder="you@example.com" required /></div>
  <div class="auth-field"><label>Password</label><input class="auth-input" type="password" placeholder="••••••••" required /></div>
  <div class="auth-row"><label><input type="checkbox" /> Remember me</label><a href="forgot-password.html">Forgot password?</a></div>
  <button class="auth-btn primary" type="submit"><i class="fa-classic fa-solid fa-arrow-right-to-bracket"></i> Sign in</button>
  <div class="auth-divider">or</div>
  <button class="auth-btn google" type="button" data-guest><i class="fa-brands fa-google"></i> Continue with Google</button>
</form>
<p class="auth-alt">New here? <a href="signup.html">Create an account</a></p>

    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
