# Camxora production — HTTPS (certs from Let's Encrypt)
# Source of truth: edit here, then: python scripts/deploy/apply_nginx.py --env production
#
# REQUIRED: proxy_*_timeout 300s on every location that proxies to platform_api (8100).
# REQUIRED: client_max_body_size 50m for onboarding create-profile (logo + cover base64 JSON).
# Without 300s, users see 504 while the API audit log still shows success.

server {
    listen 443 ssl;
    server_name api.camxora.com;

    ssl_certificate /etc/letsencrypt/live/api.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~ ^/api/v3/(web-music/play/|web-music/generations/[^/]+/stream|web-music/licenses/|public/streaming/tracks/[^/]+/stream) {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Origin-Verify "__EDGE_VERIFY__";
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Origin-Verify "__EDGE_VERIFY__";
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/v3/ws {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl;
    server_name www.camxora.com camxora.com;

    ssl_certificate /etc/letsencrypt/live/api.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Origin-Verify "__EDGE_VERIFY__";
    }
}



server {
    listen 443 ssl;
    server_name admin.camxora.com;

    ssl_certificate /etc/letsencrypt/live/api.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/camxora/repo/admin_portal/dist;
    index index.html;

    location /api/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Origin-Verify "__EDGE_VERIFY__";
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

