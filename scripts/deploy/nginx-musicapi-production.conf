# Camxora musicapi production — HTTPS (certs from Let's Encrypt) + port-80 redirect.
# Source of truth: edit here, then: python scripts/deploy/apply_musicapi_nginx.py --env production
#
# Surfaces:
#   musicapi.camxora.com        -> public home page + /privacy + /terms + /docs
#                                  + workspace (web-user, 127.0.0.1:4001) for all
#                                  non-API paths, while API paths stay on the core
#                                  API (127.0.0.1:4003). This host is the OAuth
#                                  consent screen's home page / privacy policy URL.
#   app.musicapi.camxora.com    -> web-user      127.0.0.1:4001
#   admin.musicapi.camxora.com  -> web-admin     127.0.0.1:4002
#
# TLS: one Let's Encrypt cert covering all three names:
#   certbot --nginx -d musicapi.camxora.com \
#                  -d app.musicapi.camxora.com \
#                  -d admin.musicapi.camxora.com \
#                  --expand --non-interactive --redirect
#
# REQUIRED: proxy_read_timeout >= the core's Fastify requestTimeout (600s) on every
# location that proxies to the core API (4003) — music jobs and downloads are long.
# REQUIRED: TRUST_PROXY=127.0.0.1 on the core so req.ip is the real client (nginx is
# the only proxy) and API-key IP whitelists work. See musicapi/.env.example.

server {
    listen 443 ssl;
    server_name musicapi.camxora.com;

    ssl_certificate /etc/letsencrypt/live/musicapi.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musicapi.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Public REST API surface: keep on the core API (4003). ----

    # Authenticated audio downloads: forward Range and stream without buffering so
    # large MP3/WAV responses reach the client promptly.
    location /me/download {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /v1/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /api/v1/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /me/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ---- web-user (Next.js) ----

    # Same-origin API proxy: the web-user browser bundle only ever calls the
    # relative /backend/* path (with credentials), so the session cookie stays
    # first-party. The trailing slash on proxy_pass strips /backend before the
    # core API (4003).
    location /backend/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Everything else (home page, /privacy, /terms, /docs, /login, /dashboard,
    # /auth/callback, _next assets) is served by the public web-user app.
    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name app.musicapi.camxora.com;

    ssl_certificate /etc/letsencrypt/live/musicapi.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musicapi.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Same-origin API proxy: the browser only ever calls the relative /backend/* path
    # (with credentials), so the session cookie stays first-party. The trailing slash
    # on proxy_pass strips the /backend prefix before the core API (4003).
    location /backend/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name admin.musicapi.camxora.com;

    ssl_certificate /etc/letsencrypt/live/musicapi.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musicapi.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /backend/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name musicapi.camxora.com app.musicapi.camxora.com admin.musicapi.camxora.com;
    return 301 https://$host$request_uri;
}
