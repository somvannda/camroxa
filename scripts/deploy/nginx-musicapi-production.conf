# Camxora musicapi production — HTTPS (certs from Let's Encrypt) + port-80 redirect.
# Source of truth: edit here, then: python scripts/deploy/apply_musicapi_nginx.py --env production
#
# Two surfaces (the core API's own docs advertise https://musicapi.camxora.com):
#   musicapi.camxora.com        -> user portal + landing page  127.0.0.1:4001
#                                  (API mounted by path: /backend, /v1, /api/v1,
#                                   /health, /payments, /me/download -> 4003)
#   admin.musicapi.camxora.com  -> web-admin                    127.0.0.1:4002
#
# There is no separate app.* host: the apex is both the landing page and the user
# app portal, and it keeps serving the public API by path so the advertised base
# URL (and the ChmabaPay webhook /payments/chmaba/webhook) stays valid.
#
# TLS: one Let's Encrypt cert covering both names:
#   certbot --nginx -d musicapi.camxora.com \
#                  -d admin.musicapi.camxora.com \
#                  --expand --non-interactive --redirect
#
# REQUIRED: proxy_read_timeout >= the core's Fastify requestTimeout (600s) on every
# location that proxies to the core API (4003) — music jobs and downloads are long.
# REQUIRED: TRUST_PROXY=127.0.0.1 on the core so req.ip is the real client (nginx is
# the only proxy) and API-key IP whitelists work. See musicapi/.env.example.

server {
    listen 443 ssl;
    server_name musicapi.camxora.com;

    ssl_certificate /etc/letsencrypt/live/musicapi.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musicapi.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Same-origin API proxy: the browser only ever calls the relative /backend/* path
    # (with credentials), so the session cookie stays first-party. The trailing slash
    # on proxy_pass strips the /backend prefix before the core API (4003).
    # Range + no buffering so authenticated audio downloads stream promptly.
    location /backend/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Authenticated audio downloads hit directly on the API base (API clients).
    location /me/download {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Public Bearer-key API (docs advertise https://musicapi.camxora.com).
    location /v1 {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /api/v1 {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin-guarded observability (401 for anonymous callers).
    location = /metrics {
        proxy_pass http://127.0.0.1:4003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payment provider webhooks (e.g. /payments/chmaba/webhook) stay on the apex.
    location /payments/ {
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the user app portal + landing page (Next.js 4001).
    location / {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}

server {
    listen 443 ssl;
    server_name admin.musicapi.camxora.com;

    ssl_certificate /etc/letsencrypt/live/musicapi.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musicapi.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /backend/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:4003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name musicapi.camxora.com admin.musicapi.camxora.com mail.camxora.com;
    return 301 https://$host$request_uri;
}

# Dedicated mail surface for the marketing sender identity.
#
# Open pixels, click redirects, the unsubscribe page and the Resend webhook all
# live on the same domain the campaigns are sent from. Reasons this is its own
# vhost rather than a path on musicapi.camxora.com:
#   * mail.camxora.com is the From domain, so links and From share a domain
#     (better trust signals; DMARC and link domains line up).
#   * musicapi.camxora.com is Cloudflare-proxied and only proxies a fixed set of
#     paths to :4003 — /mail/* and /webhooks/* would fall through to the Next
#     app (4001) and 404.
#   * tracking traffic is machine traffic from mail clients; keeping it off the
#     product vhost keeps product logs and rate limits clean.
#
# DNS: mail.camxora.com A -> 82.197.71.248, Proxy status DNS only (grey), so
# Cloudflare cannot cache the pixel or challenge the mail-client requests.
# The MX record already on this name (inbound SES) is unrelated and untouched.
server {
    listen 443 ssl;
    server_name mail.camxora.com;

    ssl_certificate /etc/letsencrypt/live/musicapi.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musicapi.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Open pixel. Cache-Control is re-asserted here because `.gif` is one of the
    # extensions proxies like to cache, and a cached pixel would only ever
    # record the first open of an email.
    location /mail/o/ {
        proxy_pass http://127.0.0.1:4003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        access_log off;
    }

    # Platform mail (admin.camxora.com / music.camxora.com). Same host, distinct
    # prefix: /api/mail/* belongs to platform_api (:8100) while /mail/* stays
    # with musicapi (:4003), so a token from one system can never be validated by
    # the other. /webhooks/resend above is musicapi's endpoint; platform has its
    # own at /api/mail/webhook/resend.
    location /api/mail/ {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Click redirect + unsubscribe page.
    location /mail/ {
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Resend delivery/bounce/complaint webhook.
    location /webhooks/ {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # This host serves no website. Send stray visitors to the product.
    location / {
        return 302 https://music.camxora.com;
    }
}
