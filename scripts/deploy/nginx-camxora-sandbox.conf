# Camxora sandbox — HTTP redirect + HTTPS (certs from Let's Encrypt)
# Main cert covers: api, sandbox, app, admin .sandbox.camxora.com
#
# REQUIRED: proxy_*_timeout 300s on every location that proxies to platform_api (8100).
# REQUIRED: client_max_body_size 50m for onboarding create-profile (logo + cover base64 JSON).
# REQUIRED: client_max_body_size 550m for admin desktop installer upload (up to 500 MB zip/exe/msi).
# See docs/DEPLOYMENT_OPERATIONS.md — without this, create-profile returns 413 Content Too Large.
server {
    listen 443 ssl;
    server_name api.sandbox.camxora.com;

    ssl_certificate /etc/letsencrypt/live/api.sandbox.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sandbox.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~ ^/api/v[13]/(web-music/play/|web-music/generations/[^/]+/stream|web-music/licenses/|public/streaming/tracks/[^/]+/stream) {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        client_max_body_size 550m;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl;
    server_name sandbox.camxora.com;

    ssl_certificate /etc/letsencrypt/live/api.sandbox.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sandbox.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}

server {
    listen 443 ssl;
    server_name app.sandbox.camxora.com;

    ssl_certificate /etc/letsencrypt/live/api.sandbox.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sandbox.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /signup {
        return 302 /register$is_args$args;
    }

    location /api/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}

server {
    listen 443 ssl;
    server_name admin.sandbox.camxora.com;

    ssl_certificate /etc/letsencrypt/live/api.sandbox.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sandbox.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/camxora/repo/admin_portal/dist;
    index index.html;

    location /api/ {
        client_max_body_size 550m;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

