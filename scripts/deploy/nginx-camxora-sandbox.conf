# Camxora sandbox — HTTP redirect + HTTPS (certs from Let's Encrypt)
# Main cert covers: api, sandbox, app, admin .sandbox.camxora.com
#
# REQUIRED: proxy_*_timeout 300s on every location that proxies to platform_api (8100).
# REQUIRED: client_max_body_size 50m for onboarding create-profile (logo + cover base64 JSON).
# REQUIRED: client_max_body_size 550m for admin desktop installer upload (up to 500 MB zip/exe/msi).
# See docs/DEPLOYMENT_OPERATIONS.md — without this, create-profile returns 413 Content Too Large.
#
# Catalog stream cache is origin nginx AFTER login (auth_request). Do not Cloudflare-cache
# these URLs publicly: track UUIDs are in the public catalog JSON.
proxy_cache_path /var/cache/nginx/camxora_catalog_audio levels=1:2 keys_zone=camxora_catalog_audio:16m max_size=2g inactive=7d use_temp_path=off;
server {
    listen 443 ssl;
    server_name api.sandbox.camxora.com;

    ssl_certificate /etc/letsencrypt/live/api.sandbox.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sandbox.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ~ ^/api/v1/public/streaming/tracks/([0-9a-fA-F-]+)/stream$ {
        auth_request /internal/camxora-play-auth;
        proxy_cache camxora_catalog_audio;
        proxy_cache_key $1$http_range;
        proxy_cache_valid 200 206 1h;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        add_header X-Catalog-Cache $upstream_cache_status always;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_buffering on;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /internal/camxora-play-auth {
        internal;
        proxy_pass http://127.0.0.1:8100/api/v1/public/streaming/play-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/(web-music/play/|web-music/generations/[^/]+/stream(/ok|/alt)?) {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        client_max_body_size 550m;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl;
    server_name sandbox.camxora.com;

    ssl_certificate /etc/letsencrypt/live/api.sandbox.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sandbox.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name app.sandbox.camxora.com;

    ssl_certificate /etc/letsencrypt/live/api.sandbox.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sandbox.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /signup {
        return 302 /register$is_args$args;
    }

    location /api/ {
        client_max_body_size 50m;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name admin.sandbox.camxora.com;

    ssl_certificate /etc/letsencrypt/live/api.sandbox.camxora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sandbox.camxora.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/camxora/repo/admin_portal/dist;
    index index.html;

    location /api/ {
        client_max_body_size 550m;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

